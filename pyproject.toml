[project]
name = "drcode"
dynamic = ["version"]
description = "Task-centric console AI coding agent (pydantic-ai + textual)"
readme = "README.md"
authors = [
    { name = "DrMoriarty", email = "drmoriarty.0@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai>=2.56.0",
    "pydantic-settings>=2.16.0",
    "textual>=8.2.8",
    # Direct import in github.py / notifications.py / agent_model.py /
    # voice/client.py — must not rely on it arriving transitively
    # (pydantic-ai switched from httpx to httpx2 in newer releases).
    "httpx>=0.27",
    # Embedded MCP server (`drcode.mcp`, docstring of docs/mcp-server-design.md
    # §0): the official Model Context Protocol SDK — pydantic-v2-native and
    # anyio-based, Streamable HTTP out of the box. It pulls starlette +
    # uvicorn + sse-starlette (bundled explicitly in drcode.spec). The
    # standalone `fastmcp` package is deliberately NOT a dependency: same
    # SDK underneath, more transitive deps, sharper churn.
    "mcp>=2.0",
    # Voice I/O (push-to-talk dictation + TTS announcements): sounddevice
    # needs the PortAudio library (bundled in its wheels; on Linux install
    # libportaudio2). numpy-free on purpose — the PCM16 buffers are handled
    # with the stdlib array module via sounddevice's raw streams. The
    # import is still guarded lazily in voice.py (a missing system
    # PortAudio library must degrade to a toast, not a crash).
    "sounddevice>=0.5",
]

[project.optional-dependencies]
# Historic no-op extra: sounddevice is a core dependency now; `--extra
# voice` is kept only so older install instructions keep working.
voice = []

[project.scripts]
drcode = "drcode:main"
# stdio→Streamable-HTTP MCP shim for clients that can only spawn a
# subprocess (docs/mcp-server-design.md §1). Logic in drcode.mcp.proxy.
drcode-mcp = "drcode.mcp_proxy:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-n auto"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

# The `version` file at the repo root is the single source of truth for the
# application version (see src/drcode/version.py); the build backend reads
# it so the package metadata can never drift from it.
[tool.hatch.version]
path = "version"
# The file contains nothing but a bare version string ("0.3.0"); the default
# hatchling pattern expects a `__version__ = "..."` Python assignment.
pattern = "^(?P<version>[^\\s]+)$"

[tool.hatch.build.targets.wheel]
packages = ["src/drcode"]
# Bundle the bundled template prompts (system prompts, compaction + init_repo
# templates) as package data inside the wheel.
include = ["src/drcode/prompts/**"]

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8",
    "ruff>=0.17.1",
    # aiohttp backs the desktop shell's ws/pty bridge (desktop/server.py)
    # AND its tests; it is pure-python and light, so it lives in `dev` —
    # the default `uv sync` (core+dev) must be able to collect the whole
    # test suite, including tests/test_desktop.py. pywebview/PyGObject
    # stay desktop-only (platform-heavy GTK/native stacks).
    "aiohttp>=3.9",
    # Pure-python imports the desktop shell's sources need for TYPE
    # CHECKING (`uv run pyright` is part of the default gate, and it
    # resolves imports against this venv): pywebview (no platform extras
    # here — desktop adds the GTK backend) and Pillow (used only by
    # desktop/packaging.py icon generation). Without them a default-
    # synced env reports unresolved imports in desktop/.
    "pywebview>=5.4",
    "Pillow>=10.0",
]
build = [
    "pyinstaller>=6.10",
]
# DrCode Desktop shell (pywebview window + aiohttp ws/pty bridge).
# Dev/build: `uv sync --group desktop --group build`.
# Linux: GTK backend (WebKitGTK via PyGObject); PyGObject is pinned below
# 3.52 so it builds against libgirepository-1.0 (present on every
# supported runner/dist), not the girepository-2.0 the newer releases need.
desktop = [
    "pywebview>=5.4; sys_platform == 'darwin'",
    "pywebview[gtk]>=5.4; sys_platform == 'linux'",
    "PyGObject>=3.42,<3.52; sys_platform == 'linux'",
    "Pillow>=10.0",
]
