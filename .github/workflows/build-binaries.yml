name: build-binaries

# Builds standalone `drcode` onedir bundles (PyInstaller, drcode.spec)
# for: macOS Apple Silicon, Linux x86_64, Linux arm64, Windows x86_64,
# and packs each into a single distributable .tar.gz.
#
# - Run manually from the Actions tab (workflow_dispatch) — the binaries
#   are built and a GitHub Release `v<version>` is published as well, or
# - Push a tag `v1.2.3` to attach the release to that exact tag.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed for the release upload (tag push or manual run)

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      # Full history AND tags are needed for the release-tag resolution
      # below (`git tag --points-at HEAD` / `git rev-parse refs/tags/...`).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "App version: ${version}"

      # Unified for both triggers (tag push `v*` and workflow_dispatch):
      #   1. if the commit being released already carries a `v*` tag (the
      #      pushed tag) -> reuse it, so the release attaches to that tag
      #   2. otherwise -> `v<version>` (from the root `version` file); if
      #      that tag already exists on a DIFFERENT commit, fall back to
      #      `v<version>.<random>` instead of moving/failing it.
      - id: tag
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < version)"
          wanted="v${version}"

          # `|| true` guards against pipefail when HEAD carries no tags;
          # version sort picks the newest `v*` tag if there are several.
          head_tag="$(git tag --points-at HEAD --sort=-v:refname | grep '^v' | head -1 || true)"

          if [ -n "${head_tag}" ]; then
            tag="${head_tag}"
          elif git rev-parse -q --verify "refs/tags/${wanted}" >/dev/null 2>&1; then
            tag="${wanted}.$(printf '%04d' $((RANDOM % 4096)))"
          else
            tag="${wanted}"
          fi

          echo "Release tag: ${tag}"
          echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (M-series runners are arm64)
          - os: macos-latest
            target: macos-arm64
          # Linux x86_64
          - os: ubuntu-latest
            target: linux-x86_64
          # Linux arm64 (free arm runner for public repos)
          - os: ubuntu-24.04-arm
            target: linux-arm64
          # Windows x86_64
          - os: windows-latest
            target: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (incl. PyInstaller and the voice extra)
        run: uv sync --group build --extra voice

      # Linux only: the sounddevice wheel is pure-Python there (no manylinux
      # wheel), so the bundle carries an ALSA-only libportaudio built from
      # source (see scripts/fetch-portaudio.sh); macOS/Windows wheels ship
      # their own PortAudio.
      - name: Install ALSA headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build bundled PortAudio (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/fetch-portaudio.sh

      - name: Build binary
        run: uv run pyinstaller --noconfirm --clean drcode.spec

      # The build produces a dist/drcode/ onedir bundle (see drcode.spec for
      # why onedir and not one-file); pack it into a single distributable
      # archive. tar preserves the executable bit, so after unpacking the
      # binary runs directly: `tar -xzf drcode-...tar.gz && ./drcode/drcode`.
      - name: Package artifact
        run: |
          version="${{ needs.prepare.outputs.version }}"
          name="drcode-${version}-${{ matrix.target }}"
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp -r "dist/drcode" "${name}"
            7z a "out/${name}.zip" "${name}"
          else
            tar -C dist -czf "out/${name}.tar.gz" drcode
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: drcode-${{ needs.prepare.outputs.version }}-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  # DrCode Desktop: the pywebview shell (desktop/) built around the
  # freshly built drcode onedir payload (downloaded from the `build` job
  # unchanged — the shell never modifies its payload).
  desktop:
    name: desktop ${{ matrix.target }}
    needs: [prepare, build]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon: DrCode.app (ad-hoc signed; real
          # Developer ID signing + notarization is a release-time,
          # external-to-CI condition)
          - os: macos-latest
            target: macos-arm64
          # Linux x86_64: AppImage (bundles WebKitGTK) + .deb (system deps)
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Download the drcode payload artifact
        uses: actions/download-artifact@v4
        with:
          name: drcode-${{ needs.prepare.outputs.version }}-${{ matrix.target }}
          path: payload

      - name: Unpack the payload into dist/drcode
        run: |
          mkdir -p dist
          tar -xzf payload/drcode-*.tar.gz -C dist

      # PyGObject (pywebview's GTK backend) builds from source on Linux.
      - name: Install GTK/WebKit build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libgirepository1.0-dev libglib2.0-dev libcairo2-dev pkg-config

      - name: Install dependencies (desktop shell group)
        run: uv sync --group desktop --group build

      - name: Build DrCode.app (macOS)
        if: runner.os == 'macOS'
        run: uv run --group desktop --group build python -m desktop.packaging --target macos --out out

      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        run: uv run --group desktop --group build python -m desktop.packaging --target appimage --out out

      - name: Build .deb (Linux)
        if: runner.os == 'Linux'
        run: uv run --group desktop --group build python -m desktop.packaging --target deb --out out

      - uses: actions/upload-artifact@v4
        with:
          name: drcode-desktop-${{ needs.prepare.outputs.version }}-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    name: publish release
    needs: [prepare, build, desktop]
    runs-on: ubuntu-latest
    steps:
      # Full history AND tags are needed to build the changelog range
      # (a default shallow checkout carries neither).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release notes
        id: notes
        shell: bash
        env:
          TAG_REF: ${{ github.ref }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          # Notes are only derived for tag pushes; manual runs have no tag
          # ref to describe a range from — let the auto-notes stand alone.
          if [[ "${TAG_REF}" != refs/tags/v* ]]; then
            echo "Not a tag push; skipping the manual notes body."
            echo "body_path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Version comes from TAG_NAME (computed in `prepare`), not from
          # the ref — on a manual run the ref carries no version at all.
          version="${TAG_NAME#v}"
          # `|| true` guards against pipefail when no other tag exists yet.
          previous_tag="$(git tag --sort=-v:refname | grep -v "^v${version}$" | head -1 || true)"

          if [ -z "${previous_tag}" ]; then
            # First release: no range to describe — let the auto-notes stand alone.
            echo "Found no previous tag; skipping the manual notes body."
            echo "body_path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changelog range: ${previous_tag}..HEAD"
          log="$(git log "${previous_tag}..HEAD" --no-merges --pretty=format:'- %s (%h)')"
          if [ -z "${log}" ]; then
            # Tag re-push or empty range: nothing to list manually.
            echo "No commits between ${previous_tag} and HEAD; skipping the manual notes body."
            echo "body_path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "## What's Changed"
            echo
            printf '%s\n' "${log}"
          } > release-notes.md
          echo "body_path=release-notes.md" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          # v-prefixed for both triggers. For tag pushes the tag already
          # exists on HEAD and is reused; for workflow_dispatch the action
          # creates it on the build commit (github.sha) when missing.
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: Release ${{ needs.prepare.outputs.tag_name }}
          files: artifacts/*
          generate_release_notes: true
          body_path: ${{ steps.notes.outputs.body_path }}
