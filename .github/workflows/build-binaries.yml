name: build-binaries

# Builds standalone `drcode` onedir bundles (PyInstaller, drcode.spec)
# for: macOS Apple Silicon, Linux x86_64, Linux arm64, Windows x86_64,
# and packs each into a single distributable .tar.gz.
#
# - Run manually from the Actions tab (workflow_dispatch), or
# - Push a tag `v1.2.3` to also create a GitHub Release with all binaries.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed for the release upload on tags

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "App version: ${version}"

  build:
    name: build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (M-series runners are arm64)
          - os: macos-latest
            target: macos-arm64
          # Linux x86_64
          - os: ubuntu-latest
            target: linux-x86_64
          # Linux arm64 (free arm runner for public repos)
          - os: ubuntu-24.04-arm
            target: linux-arm64
          # Windows x86_64
          - os: windows-latest
            target: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (incl. PyInstaller and the voice extra)
        run: uv sync --group build --extra voice

      # Linux only: the sounddevice wheel is pure-Python there (no manylinux
      # wheel), so the bundle carries an ALSA-only libportaudio built from
      # source (see scripts/fetch-portaudio.sh); macOS/Windows wheels ship
      # their own PortAudio.
      - name: Install ALSA headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build bundled PortAudio (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/fetch-portaudio.sh

      - name: Build binary
        run: uv run pyinstaller --noconfirm --clean drcode.spec

      # The build produces a dist/drcode/ onedir bundle (see drcode.spec for
      # why onedir and not one-file); pack it into a single distributable
      # archive. tar preserves the executable bit, so after unpacking the
      # binary runs directly: `tar -xzf drcode-...tar.gz && ./drcode/drcode`.
      - name: Package artifact
        run: |
          version="${{ needs.prepare.outputs.version }}"
          name="drcode-${version}-${{ matrix.target }}"
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp -r "dist/drcode" "${name}"
            7z a "out/${name}.zip" "${name}"
          else
            tar -C dist -czf "out/${name}.tar.gz" drcode
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: drcode-${{ needs.prepare.outputs.version }}-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      # Full history AND tags are needed to build the changelog range
      # (a default shallow checkout carries neither).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release notes
        id: notes
        shell: bash
        env:
          TAG_REF: ${{ github.ref }}
        run: |
          version="${TAG_REF#refs/tags/v}"
          # `|| true` guards against pipefail when no other tag exists yet.
          previous_tag="$(git tag --sort=-v:refname | grep -v "^v${version}$" | head -1 || true)"

          if [ -z "${previous_tag}" ]; then
            # First release: no range to describe — let the auto-notes stand alone.
            echo "Found no previous tag; skipping the manual notes body."
            echo "body_path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changelog range: ${previous_tag}..HEAD"
          log="$(git log "${previous_tag}..HEAD" --no-merges --pretty=format:'- %s (%h)')"
          if [ -z "${log}" ]; then
            # Tag re-push or empty range: nothing to list manually.
            echo "No commits between ${previous_tag} and HEAD; skipping the manual notes body."
            echo "body_path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "## What's Changed"
            echo
            printf '%s\n' "${log}"
          } > release-notes.md
          echo "body_path=release-notes.md" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body_path: ${{ steps.notes.outputs.body_path }}
