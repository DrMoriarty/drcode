name: build-binaries

# Builds standalone one-file `drcode` binaries (PyInstaller, drcode.spec)
# for: macOS Apple Silicon, Linux x86_64, Linux arm64, Windows x86_64.
#
# - Run manually from the Actions tab (workflow_dispatch), or
# - Push a tag `v1.2.3` to also create a GitHub Release with all binaries.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed for the release upload on tags

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "App version: ${version}"

  build:
    name: build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (M-series runners are arm64)
          - os: macos-latest
            target: macos-arm64
            exe: drcode
          # Linux x86_64
          - os: ubuntu-latest
            target: linux-x86_64
            exe: drcode
          # Linux arm64 (free arm runner for public repos)
          - os: ubuntu-24.04-arm
            target: linux-arm64
            exe: drcode
          # Windows x86_64
          - os: windows-latest
            target: windows-x86_64
            exe: drcode.exe

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (incl. PyInstaller)
        run: uv sync --group build

      - name: Build binary
        run: uv run pyinstaller --noconfirm --clean drcode.spec

      # Release assets don't preserve the executable bit, so unix binaries
      # are shipped gzipped (run `gunzip drcode-...gz && chmod +x drcode`).
      - name: Package artifact
        run: |
          version="${{ needs.prepare.outputs.version }}"
          name="drcode-${version}-${{ matrix.target }}"
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "dist/${{ matrix.exe }}" "out/${name}.exe"
          else
            gzip -c "dist/${{ matrix.exe }}" > "out/${name}.gz"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: drcode-${{ needs.prepare.outputs.version }}-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
